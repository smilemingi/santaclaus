<script>

let houses=[],gifts=[],parts=[],texts=[],stars=[],snow=[],clouds=[],items=[],lets=[],rings=[],trail=[];

try{Object.assign(sv,JSON.parse(localStorage.getItem('avodoSanta')||'{}'))}catch(e){}

const cols=['#c0392b','#2e86c1','#8e44ad','#d68910','#148f77','#cb4335','#5d6d7e','#2c7a5b'],rcs=['#4a3d63','#6b2a2a','#2f4f4f','#6b4a2b','#3a3f6b','#2d2440'],dcs=['#5a3418','#7a1f2b','#1f4e5f'],gc=['#ff4d6d','#4dabf7','#69db7c','#ffd43b','#da77f2'];
const GT=[{n:'Gift Box',p:100},{n:'Candy Cane',p:120},{n:'Gingerbread',p:130},{n:'Lollipop',p:110},{n:'Star Cookie',p:150},{n:'Stocking',p:140},{n:'Jingle Bell',p:160},{n:'Ornament',p:120}];

const SK=[
{n:'Midnight Village',sky:['#04081f','#18266a','#5a67aa'],mt:['#3a4890','#2a3877'],vs:'#1a2556',pn:['#14204b','#fff'],gr:['#f4f8ff','#a3b5de'],au:[['#2bff88',.15,90],['#3aa0ff',.11,130],['#b04dff',.1,170]],orb:'moon',oc:'#fff8dc',fog:'190,205,255',sa:1,tr:'pine',fl:['#fff']},
{n:'Aurora Peaks',sky:['#021a24','#0b4458','#3c7c8c'],mt:['#2f7080','#1f5566'],vs:'#103846',pn:['#0a2f3a','#e8fff8'],gr:['#effcff','#8fc4d4'],au:[['#3dffa5',.3,70],['#56d8ff',.22,120],['#a7ff7a',.18,165]],orb:'moon',oc:'#e6fff6',fog:'150,230,240',sa:1,tr:'pine',fl:['#eaffff','#fff']},
{n:'Candy Kingdom',sky:['#3a1658','#a1458f','#ffb3c8'],mt:['#d77aa8','#b8579a'],vs:'#8c3a7a',pn:['#ff8fc0','#fff'],gr:['#fff5fb','#f2b3d3'],au:[['#ff8fd4',.16,100],['#ffd36e',.1,150]],orb:'moon',oc:'#fff0f7',fog:'255,190,230',sa:.6,tr:'candy',fl:['#fff','#ffd6e8','#d6f0ff']},
{n:'Golden Dawn',sky:['#2a1a4a','#e0644e','#ffcf7a'],mt:['#8a4a6e','#6b3a62'],vs:'#4a2a55',pn:['#3a1f45','#ffe9c4'],gr:['#fff6e8','#e6b88e'],au:[],orb:'sun',oc:'#ffd36a',fog:'255,200,150',sa:.25,tr:'pine',fl:['#fff','#ffe9c4']},
{n:'Cosmic Night',sky:['#05010f','#240a4d','#5b1f8a'],mt:['#3b1f6e','#2a1655'],vs:'#1a0c3a',pn:['#170a33','#d9c6ff'],gr:['#e9e0ff','#9a85d6'],au:[['#ff4dd8',.2,90],['#4dc9ff',.18,140],['#8f6bff',.16,190]],orb:'planet',oc:'#ffb86b',fog:'190,160,255',sa:1.6,tr:'pine',fl:['#fff','#e0d0ff']}];
const SLG=[
{n:'Classic Red',b:'#c1121f',t:'#ffd166',tr:['#ffd166','#fff'],perk:'Pure tradition'},
{n:'Golden Glide',b:'#d99a12',t:'#fff3b0',tr:['#ffd166','#fff3b0','#ffb703'],perk:'Score x1.15'},
{n:'Candy Cruiser',b:'#ff5c8a',t:'#ffffff',tr:['#ff8fc0','#fff','#9be7ff'],perk:'Chimneys +4 wider',stripe:1},
{n:'Frost Runner',b:'#3d9be0',t:'#e8f6ff',tr:['#bfe9ff','#fff','#7cc8ff'],perk:'Power-ups last 50% longer'},
{n:'Galaxy Rocket',b:'#4b2a9a',t:'#ff7bf0',tr:['#ff7bf0','#7bd0ff','#fff'],perk:'+6 start gifts, 2x refill',stars:1}];
const BGN=[0,12,35,70,120],SLN=[0,1500,5000,12000,25000];
const countB=()=>BGN.filter(n=>sv.del+runDel>=n).length,countS=()=>SLN.filter(n=>sv.tot+score>=n).length;
if(sv.del<BGN[sv.bg|0])sv.bg=0;if(sv.tot<SLN[sv.sl|0])sv.sl=0;
function applySkin(){K=SK[sv.bg];SL=sv.sl}applySkin();
function pickT(){return R()<.25?0:1+(R()*7|0)}nextT=pickT();
function resize(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;S=cv.height/H;W=cv.width/S}
addEventListener('resize',resize);resize();
for(let i=0;i<140;i++)stars.push({x:R(),y:R()*.62,r:R()*1.5+.4,p:R()*6});
for(let i=0;i<150;i++)snow.push({x:R(),y:R(),z:R()*.8+.4,p:R()*6,ci:R()*5|0});
for(let i=0;i<6;i++)clouds.push({x:R(),y:40+R()*150,s:.6+R()*.8});

/* ================= AUDIO ================= */
const NS={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function fr(n){const m=/^([A-G])(#?)(\d)$/.exec(n);return 440*Math.pow(2,(12*(+m[3]+1)+NS[m[1]]+(m[2]?1:0)-69)/12)}
const sem=s=>261.63*Math.pow(2,s/12);
const CH={C:[0,4,7],F:[5,9,12],G:[7,11,14],D:[2,6,9],Am:[9,12,16],Em:[4,7,11]};
const SG=[
{bpm:132,bar:4,pk:0,ch:'C C C C F C G G C C C C F C G C',m:'E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4 F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 E4:1 D4:1 D4:1 E4:1 D4:2 G4:2 E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4 F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 G4:1 G4:1 F4:1 D4:1 C4:4'},
{bpm:88,bar:3,pk:0,ch:'C C C C G G C C F F C C F F C C G G C C C G C',m:'G4:1.5 A4:.5 G4:1 E4:3 G4:1.5 A4:.5 G4:1 E4:3 D5:2 D5:1 B4:3 C5:2 C5:1 G4:3 A4:2 A4:1 C5:1.5 B4:.5 A4:1 G4:1.5 A4:.5 G4:1 E4:3 A4:2 A4:1 C5:1.5 B4:.5 A4:1 G4:1.5 A4:.5 G4:1 E4:3 D5:2 D5:1 F5:1.5 D5:.5 B4:1 C5:3 E5:3 C5:1 G4:1 E4:1 G4:1.5 F4:.5 D4:1 C4:3'},
{bpm:118,bar:3,pk:1,ch:'G C D D Em G D G',m:'D4:1 G4:1 G4:.5 A4:.5 G4:.5 F#4:.5 E4:1 E4:1 E4:1 A4:1 A4:.5 B4:.5 A4:.5 G4:.5 F#4:1 D4:1 D4:1 B4:1 B4:.5 C5:.5 B4:.5 A4:.5 G4:1 E4:1 D4:.5 D4:.5 E4:1 A4:1 F#4:1 G4:3'}];
let ac,bus,mm,nb,musicOn=true,mi=0,kk=0,mt=0,ev=[],ei=0,tot=0;
function loadSong(i){mi=i;ev=[];ei=0;kk=0;let b=0;SG[i].m.split(' ').forEach(x=>{const[n,d]=x.split(':');ev.push({b,f:fr(n)*2,d:+d});b+=+d});tot=b}
function initAudio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mm=ac.createGain();mm.gain.value=musicOn?.6:0;mm.connect(ac.destination);bus=ac.createGain();bus.connect(mm);
 const n=ac.sampleRate*1.9|0,b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(R()*2-1)*Math.pow(1-i/n,2.6)}
 const rv=ac.createConvolver();rv.buffer=b;const wg=ac.createGain();wg.gain.value=.4;bus.connect(rv);rv.connect(wg);wg.connect(mm);
 const dl=ac.createDelay();dl.delayTime.value=.27;const fb=ac.createGain();fb.gain.value=.3;const dg=ac.createGain();dg.gain.value=.22;bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(mm);
 nb=ac.createBuffer(1,2200,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<2200;i++)d[i]=(R()*2-1)*(1-i/2200);loadSong(0)}
 if(ac.state==='suspended')ac.resume()}catch(e){}}
function osc(f,s,d,v,ty,at=.008){const o=ac.createOscillator(),a=ac.createGain();o.type=ty;o.frequency.value=f;a.gain.setValueAtTime(0,s);a.gain.linearRampToValueAtTime(v,s+at);a.gain.exponentialRampToValueAtTime(.0008,s+d);o.connect(a);a.connect(bus);o.start(s);o.stop(s+d+.05)}
function bell(f,s,d){osc(f,s,d,.17,'sine');osc(f*2,s,d*.5,.06,'sine');osc(f*3.01,s,d*.25,.03,'sine');osc(f/2,s,d*.8,.05,'triangle')}
function pad(sm,s,d){const o=ac.createOscillator(),a=ac.createGain(),lp=ac.createBiquadFilter();o.type='triangle';o.frequency.value=sem(sm-12);lp.type='lowpass';lp.frequency.value=900;a.gain.setValueAtTime(0,s);a.gain.linearRampToValueAtTime(.03,s+.18);a.gain.setValueAtTime(.03,s+d*.8);a.gain.exponentialRampToValueAtTime(.0008,s+d);o.connect(lp);lp.connect(a);a.connect(bus);o.start(s);o.stop(s+d+.05)}
function shk(s,v){const n=ac.createBufferSource(),hp=ac.createBiquadFilter(),a=ac.createGain();n.buffer=nb;hp.type='highpass';hp.frequency.value=6500;a.gain.value=v;n.connect(hp);hp.connect(a);a.connect(bus);n.start(s)}
function music(){if(!ac||st!=='play')return;const S0=SG[mi],b=60/(S0.bpm*(1+(lv-1)*.04+(bon>0?.15:0)));
 while(mt<ac.currentTime+.35){const pos=kk/2,s=Math.max(mt,ac.currentTime);
  while(ei<ev.length&&ev[ei].b<=pos+.001){const e=ev[ei++];bell(e.f,s,Math.min(e.d*b*1.2+.3,1.7))}
  const rel=pos-S0.pk,bi=Math.floor(rel/S0.bar),cl=S0.ch.split(' ');
  if(rel>=0&&bi<cl.length){const c=CH[cl[bi]]||CH.C,bb=rel-bi*S0.bar;
   if(kk%2===0){if(bb===0)c.forEach(x=>pad(x,s,S0.bar*b));if(bb===0||(S0.bar===4&&bb===2))osc(sem(c[0]-24),s,b*.9,.2,'triangle',.01);else c.forEach(x=>osc(sem(x),s,b*.35,.03,'triangle'));shk(s,.05)}else shk(s,.025)}
  else if(kk%2===0)shk(s,.03);
  mt+=b/2;kk++;if(kk/2>=tot+1)loadSong((mi+1)%SG.length)}}
setInterval(music,100);
function beep(f,d,ty='sine',v=.08,f2){try{initAudio();const o=ac.createOscillator(),a=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,ac.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);a.gain.setValueAtTime(v,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function hoho(){const n=performance.now();if(n-lastHo<450)return;lastHo=n;try{initAudio();const t0=ac.currentTime;for(let i=0;i<3;i++){const s=t0+.05+i*.25,o=ac.createOscillator(),a=ac.createGain(),lp=ac.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(150-i*10,s);o.frequency.exponentialRampToValueAtTime(88-i*4,s+.2);a.gain.setValueAtTime(0,s);a.gain.linearRampToValueAtTime(.5,s+.03);a.gain.exponentialRampToValueAtTime(.001,s+.22);lp.type='lowpass';lp.frequency.value=1400;lp.connect(a);a.connect(ac.destination);[[520,4,1],[900,5,.6]].forEach(([fq,q,gv])=>{const b=ac.createBiquadFilter(),gn=ac.createGain();b.type='bandpass';b.frequency.value=fq;b.Q.value=q;gn.gain.value=gv;o.connect(b);b.connect(gn);gn.connect(lp)});o.start(s);o.stop(s+.25)}}catch(e){}}
$('mu').onclick=()=>{musicOn=!musicOn;$('mu').textContent=musicOn?'🔊':'🔇';if(mm)mm.gain.value=musicOn?.6:0};

/* ================= GAME LOGIC ================= */
function rr(a,b){return a+R()*(b-a)}
const dur=x=>x*(SL===3?1.5:1);
function gapFn(){const r=R(),s=spd*.14;return r<.3?rr(55,95)+s:r<.7?rr(170,270)+s*1.5:rr(320,480)+s*2}
function hp(rt,f){f=Math.min(1,Math.max(0,f));if(rt===2)return Math.min(1,(1-Math.abs(2*f-1))*2.6);if(rt===3)return f<.7?f/.7:(1-f)/.3;if(rt===4)return Math.sqrt(Math.max(0,1-(2*f-1)*(2*f-1)));return 1-Math.abs(2*f-1)}
function roofY(h,x){return GY-h.h-h.rh*hp(h.rt,(x-h.x)/h.w)}
function chim(h){const cx=h.x+h.w*h.cf;return{cx,ct:roofY(h,cx)-30}}
function chW(h){return(Math.max(20,28-(lv-1)*.9)+(SL===2?4:0)+(fx.big>0?9:0))*(h.gold?.82:1)}
function spawn(x){const two=R()<.3,w=rr(100,170),h=two?rr(98,120):rr(58,90),rt=R()*5|0,rh=[rr(42,60),rr(60,78),rr(28,38),rr(44,62),rr(36,50)][rt],nice=R()<.58,gold=nice&&lv>1&&R()<.14;
 houses.push({x,w,h,rh,rt,nice,gold,col:cols[R()*cols.length|0],rc:rcs[R()*rcs.length|0],cf:R()<.5?rr(.2,.32):rr(.68,.8),done:0,ph:R()*6,dc:R()*6|0,fl:0,ly:R()*3|0,two,ws:R()*3|0,sh:R()<.5,aw:R()<.5,dcl:dcs[R()*3|0]});nextGap=gapFn()}
function resetWorld(){houses=[];gifts=[];parts=[];texts=[];items=[];lets=[];rings=[];trail=[];banner=null;tst=null;fx=fx0();bon=0;lt=0}
function reset(){score=0;lives=5;combo=0;lv=1;sack=12+(SL===4?6:0);runDel=0;rg=0;zoom=0;t=0;spd=175;cool=0;itT=3;ltT=7;wind=0;resetWorld();nextT=pickT();annB=countB();annS=countS();spawn(W*.85);if(ac){loadSong(0);mt=ac.currentTime+.15}}
function burst(x,y,cs,n,sp,gr=300,life=1){if(parts.length>520)parts.splice(0,120);for(let i=0;i<n;i++){const a=R()*PI2,s=R()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,l:life*(.5+R()*.6),m:life,c:cs[R()*cs.length|0],r:R()*3+1.5,g:gr})}}
function say(x,y,s,c){if(texts.length>14)texts.shift();texts.push({x,y,s,c,t:0})}
function santa(){return{x:Math.max(110,W*.27),y:150+Math.sin(t*2.2)*12}}
function drop(){if(st!=='play'||cool>0||bon>0)return;const p=santa();if(sack<=0){cool=.3;say(p.x,p.y-70,'Out of gifts!','#ff9f43');beep(160,.15,'square',.05);return}
